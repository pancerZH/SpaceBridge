name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  synthetic:
    # The synthetic tests and the three install paths of docs/usage.md. No model or dataset downloads, no GPU.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for the CUDA wheels
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: astral-sh/setup-uv@v5
      - name: The library alone imports
        run: |
          uv sync --no-default-groups
          uv run --no-sync python -c "import spacebridge"
      - name: Real-model adapters import, with the models and banks extras only
        run: |
          uv sync --no-default-groups --extra models --extra banks
          uv run --no-sync python -c "import sentence_transformers, datasets; from spacebridge import SentenceTransformerEncoder, CrossEncoderReranker"
      - name: Tests, with HNSW
        run: |
          uv sync --extra hnsw
          uv run --no-sync pytest -q
      - name: Wheel holds both packages
        run: |
          uv build --wheel
          python -m zipfile -l dist/*.whl > members.txt
          for m in spacebridge/__init__.py spacebridge/mount.py spacebridge/identity.py spacebridge/quality_calibration.json spacebridge_bench/run.py spacebridge_bench/provenance.py; do
            grep -q "$m" members.txt || { echo "missing from the wheel: $m"; exit 1; }
          done
