[project]
name = "spacebridge"
version = "0.1.0"
description = "Zero-reindexing cross-model query alignment for frozen vector indexes"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "torch>=2.7",
]

[project.optional-dependencies]
# SentenceTransformerEncoder, the adapter for real models. The engine itself only needs numpy, scikit-learn and torch.
models = [
    "sentence-transformers>=6.0",
    "transformers>=4.51",
]
# Parallel-sentence banks for query languages other than the index's (FLORES is gated: it needs an HF token).
banks = [
    "datasets>=3.0",
    "huggingface-hub>=0.30",
]

[dependency-groups]
bench = [
    "datasets>=3.0",
    "sentence-transformers>=6.0",
    "transformers>=4.51",
    "tqdm>=4.66",
    "pillow>=11.0",
    "torchvision>=0.26",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
spacebridge-bench = "spacebridge_bench.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacebridge", "src/spacebridge_bench"]

[tool.uv]
default-groups = ["bench", "dev"]
# Only resolve releases that have been public for at least two weeks.
exclude-newer = "2026-10-16T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
